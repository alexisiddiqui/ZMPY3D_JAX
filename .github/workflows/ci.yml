name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize NumPy reference
        run: git submodule update --init --depth 1 externals/ZMPY3D

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run correctness suite
        run: uv run --no-sync pytest -q
